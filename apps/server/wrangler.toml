# Agent Office: one Worker + one SQLite-backed Durable Object ("office").
# Deployed by Cloudflare Workers Builds (Git integration, see README "Deploy"): root directory =
# repo root, build `bun install --frozen-lockfile && bun run --filter @agent-office/web build`,
# deploy `cd apps/server && npx wrangler deploy`. All paths below are relative to this file.
# The Worker name in the Cloudflare dashboard must match `name`.
name = "agent-office"
main = "src/index.ts"
compatibility_date = "2025-10-01"
# Variables added in the dashboard (e.g. GENUI_PROVIDER) survive deploys. Names listed in
# [vars] below are still reset to these values on every deploy.
keep_vars = true
# Keep the public https://agent-office.<subdomain>.workers.dev URL on after every deploy.
workers_dev = true

# install.sh is bundled into the Worker as a text module
rules = [{ type = "Text", globs = ["**/*.sh"], fallthrough = true }]

[assets]
directory = "../web/dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash" # /stats -> stats.html, /timelapse -> timelapse.html
not_found_handling = "none"
# every request passes the viewer password gate in the Worker first
run_worker_first = true

[[durable_objects.bindings]]
name = "OFFICE"
class_name = "Office"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Office"]

[vars]
OFFICE_NAME = "Agent Office"
OFFICE_TIMEZONE = "Europe/Vienna"
# GENUI_PROVIDER is unset here (= "off") so it can be set in the dashboard: anthropic | jev.
# With a provider on, a person's self-description (up to 8000 chars) becomes a detailed look:
# anthropic defaults to claude-haiku-4-5 (structured outputs, no thinking, max_tokens 8000),
# jev to openai/gpt-4o-mini; GENUI_MODEL overrides either. GENUI_MODEL=claude-opus-5-5 is the
# explicit, pricier choice for more faithful looks (adaptive thinking, GENUI_EFFORT default
# "low", server-side refusal fallbacks, max_tokens 16000). People without a description never
# trigger a call, and a provider switch or a deploy without the API key keeps every generated
# look. One call per description change (and once per look-format revision, e.g. right after
# a deploy that bumps it), at most 2 in flight, 120 s timeout. Rough cost per call (~3-8k input
# + ~4-6k output tokens): claude-haiku-4-5 about $0.02-0.04, so the cap below bounds a day at
# roughly $1-2; claude-opus-5-5 at effort low about $0.10-0.15 and 30-90 s, roughly $5-8 a day.
GENUI_MAX_CALLS_PER_DAY = "50"
# "auto": the server asks GitHub for the latest release of GITHUB_REPO when a connector says
# hello (cached 5 min). A fixed version (e.g. --var LATEST_CONNECTOR_VERSION:0.1.42) wins.
LATEST_CONNECTOR_VERSION = "auto"
GITHUB_REPO = "MrGatzi/agent-camp"
MIN_CONNECTOR_VERSION = "0.0.0"

# Secrets (wrangler secret put ...; locally in .dev.vars):
#   CONNECTOR_PASSWORD   shared connector password (required)
#   VIEWER_KEY           optional ?key= that also lets viewers in (kiosk links); the
#                        login page uses CONNECTOR_PASSWORD
#   ANTHROPIC_API_KEY    for GENUI_PROVIDER=anthropic
#   AI_GATEWAY_API_KEY   for GENUI_PROVIDER=jev
# Optional vars: GENUI_MODEL (anthropic default claude-haiku-4-5, e.g. claude-opus-5-5; or a
#                gateway id like openai/gpt-4o-mini for jev), GENUI_EFFORT (anthropic models
#                with effort, e.g. claude-opus-5-5: low | medium | high | xhigh | max; higher =
#                more faithful but slower and pricier; ignored for claude-haiku-4-5),
#                SERVER_VERSION,
#                DEV_MODE ("1" = password defaults to "devpass")
# Try a description against the real API without deploying:
#   ANTHROPIC_API_KEY=... bun apps/server/scripts/genui-try.ts <description.md>
