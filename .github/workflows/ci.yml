name: CI

# PRs only: a push to a PR branch used to run everything twice (push + pull_request).
# main is handled by release.yml (CI already ran on the PR); other branches can run it by hand.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"

jobs:
  check:
    name: Lint, typecheck, test, e2e, web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: End-to-end (server + real connector + viewer)
        run: bun run test:e2e

      - name: Build web
        run: bun run --filter @agent-office/web build

  # the scenes run one after another in real time (~12 min in one job): 4 balanced parts in parallel
  screenshots:
    name: Screenshots ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      # the runner's apt mirrors are sometimes unreachable or hang: time out, retry, then skip the screenshots
      # (a warning, not a red build) instead of blocking every PR on a network outage
      - name: Install Playwright Chromium
        id: browsers
        run: |
          for i in 1 2 3; do
            if timeout 180 bun run --cwd tools/screenshots install-browsers; then # pinned playwright version
              echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep $((i * 20))
          done
          echo "::warning::Could not install Chromium (network?); skipping screenshots"
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Screenshots
        if: steps.browsers.outputs.ok == 'true'
        run: bun run screenshots -- --shard ${{ matrix.shard }}/4

      # only what this shard (re)shot: the committed images from the other shards would overwrite theirs
      - name: Collect this shard's files
        if: ${{ !cancelled() }}
        run: |
          mkdir -p shard
          git ls-files -m -o --exclude-standard screenshots | xargs -r cp --parents -t shard

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.shard }}
          path: shard/screenshots/
          if-no-files-found: warn
          retention-days: 1

  screenshots-merge:
    name: Collect screenshots
    needs: screenshots
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: screenshots
          pattern: screenshots-*
          delete-merged: true
          retention-days: 14

  connector:
    name: Connector binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build darwin-arm64, darwin-x64, linux-x64
        working-directory: apps/connector
        env:
          AGENT_OFFICE_VERSION: 0.0.0-ci.${{ github.run_number }}
        run: bun scripts/build.ts darwin-arm64 darwin-x64 linux-x64

      - name: Smoke-test the linux binary
        working-directory: apps/connector
        run: ./dist/agent-office-linux-x64 version

      - uses: actions/upload-artifact@v4
        with:
          name: connector-binaries
          path: |
            apps/connector/dist/agent-office-*
            apps/connector/dist/install.sh
          if-no-files-found: error
          retention-days: 14
