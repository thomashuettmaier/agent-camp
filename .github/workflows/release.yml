name: Release

# Merge to main -> GitHub Release (connector binaries + install.sh). Kept lean for
# "merge -> live in < 5 min": no e2e/screenshots here; ci.yml ran them on the PR.
#
# The release job needs NO secrets: it uses the built-in GITHUB_TOKEN.
#
# The server is deployed by Cloudflare Workers Builds (Cloudflare's own Git integration, see
# README "Deploy"), which builds and deploys every push to main itself, so no Cloudflare keys
# live in GitHub. The server finds the newest connector release on its own
# (LATEST_CONNECTOR_VERSION = "auto" in wrangler.toml).
#
# Optional, instead of Workers Builds: deploy from GitHub Actions by adding the repo secrets
# CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID. Without them the
# deploy job prints a notice and skips (the release still happens). Do not use both, or every
# push deploys twice.
#
# Server secrets (CONNECTOR_PASSWORD, optional VIEWER_KEY, ANTHROPIC_API_KEY, AI_GATEWAY_API_KEY)
# live in Cloudflare, never in GitHub; deploys keep them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false # never cancel a half-finished release/deploy

# VERSION is <major>.<minor> from package.json plus the commit count of main (scripts/version.ts),
# the same number the web build stamps into the page.
env:
  BUN_VERSION: "1.4.4"

jobs:
  release:
    name: Build connector + GitHub Release
    # a run on another branch would publish that branch's count as the latest release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version counts commits

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Version
        id: version
        run: |
          v="$(bun scripts/version.ts)"
          test -n "$v"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: bun test

      - name: Build connector binaries
        working-directory: apps/connector
        env:
          AGENT_OFFICE_VERSION: ${{ env.VERSION }}
        run: |
          bun scripts/build.ts darwin-arm64 darwin-x64 linux-x64
          test "$(./dist/agent-office-linux-x64 version)" = "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          files="apps/connector/dist/agent-office-darwin-arm64 apps/connector/dist/agent-office-darwin-x64 apps/connector/dist/agent-office-linux-x64 apps/connector/install.sh"
          if gh release view "$tag" >/dev/null 2>&1; then
            # re-run, or another run on the same commit: same version, so refresh the assets
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files \
              --target "$GITHUB_SHA" \
              --title "Agent Office $tag" \
              --generate-notes \
              --latest
          fi

  # Optional: deploy from GitHub Actions instead of Workers Builds. Skips (green) unless the
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets exist.
  deploy:
    name: "Optional: deploy from GitHub Actions instead of Workers Builds"
    needs: release # pins the version only after its binaries are downloadable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets: skipping (expected when Cloudflare Workers Builds deploys the server; it auto-detects the connector version)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          fetch-depth: 0 # the web build counts commits for its version

      - uses: oven-sh/setup-bun@v2
        if: steps.secrets.outputs.ok == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        if: steps.secrets.outputs.ok == 'true'
        run: bun install --frozen-lockfile

      - name: Build web
        if: steps.secrets.outputs.ok == 'true'
        run: bun run --filter @agent-office/web build

      # Pinning LATEST_CONNECTOR_VERSION here is optional (the server could auto-detect it), but it
      # announces the new version on the very first reconnect, without a GitHub lookup.
      - name: wrangler deploy (LATEST_CONNECTOR_VERSION=${{ env.VERSION }})
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/server
        run: |
          bunx wrangler deploy \
            --var "LATEST_CONNECTOR_VERSION:$VERSION" \
            --var "SERVER_VERSION:$VERSION"
